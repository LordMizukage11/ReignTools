<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1a0e0e">
  <title>Reign: Warcraft Tool</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Cinzel+Decorative:wght@700;900&family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body { font-family: 'Crimson Text', Georgia, serif; background-color: #0a0a0a; }
    button, input, select { font-family: inherit; }

    .app-wrapper {
      min-height: 100vh; padding: 20px;
      transition: background 0.6s ease;
      --danger: #a03030; --danger-light: #c04040;
      --d10: polygon(50% 0%, 100% 34%, 82% 100%, 18% 100%, 0% 34%);
      padding-bottom: calc(20px + env(safe-area-inset-bottom));
      position: relative;
    }
    .app-wrapper::before {
      content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background-image:
        repeating-linear-gradient(45deg, rgba(255,255,255,0.014) 0 2px, transparent 2px 4px),
        repeating-linear-gradient(-45deg, rgba(0,0,0,0.05) 0 3px, transparent 3px 6px);
    }
    .app-wrapper > * { position: relative; z-index: 1; }

    .container {
      max-width: 820px; margin: 0 auto; background: var(--bg-panel);
      border-radius: 5px; padding: 40px 30px 34px;
      box-shadow: 0 0 90px rgba(0,0,0,0.75), inset 0 0 90px rgba(0,0,0,0.2), 0 0 0 1px rgba(0,0,0,0.5);
      border: 1px solid var(--panel-border); position: relative;
    }
    .container::before {
      content: ''; position: absolute; inset: 7px; border: 1px solid var(--accent-dim);
      opacity: 0.35; pointer-events: none; border-radius: 2px;
    }
    .corner {
      position: absolute; color: var(--ornament); font-size: 0.7em; line-height: 1;
      opacity: 0.75; pointer-events: none; text-shadow: 0 0 8px var(--accent-dim);
    }
    .corner.tl { top: 3px; left: 3px; } .corner.tr { top: 3px; right: 3px; }
    .corner.bl { bottom: 3px; left: 3px; } .corner.br { bottom: 3px; right: 3px; }

    /* ---------------- Crest artwork ---------------- */
    .crest-svg { display: block; color: var(--accent); }
    .crest { text-align: center; position: relative; margin-bottom: 6px; }
    .crest-main {
      width: 74px; height: 74px; margin: 0 auto 8px;
      filter: drop-shadow(0 0 16px var(--accent-dim)) drop-shadow(0 2px 3px rgba(0,0,0,0.7));
    }
    .crest-watermark {
      position: absolute; top: -26px; left: 50%; transform: translateX(-50%);
      width: 230px; height: 230px; opacity: 0.055;
      pointer-events: none; user-select: none; z-index: -1;
    }
    h1 {
      text-align: center; color: var(--accent); font-family: 'Cinzel Decorative', 'Cinzel', serif;
      font-weight: 900; font-size: 2.1em; letter-spacing: 3px; margin-bottom: 4px;
      text-shadow: 0 0 24px var(--accent-dim), 0 2px 3px rgba(0,0,0,0.7);
    }
    .subtitle {
      text-align: center; color: var(--text-dim); font-size: 0.78em; letter-spacing: 4px;
      text-transform: uppercase; font-family: 'Cinzel', serif;
    }
    .flourish { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 12px 0 22px; }
    .flourish::before, .flourish::after {
      content: ''; height: 1px; width: 90px;
      background: linear-gradient(90deg, transparent, var(--accent-dim));
    }
    .flourish::after { background: linear-gradient(90deg, var(--accent-dim), transparent); }
    .flourish span { color: var(--accent); font-size: 0.6em; opacity: 0.8; }

    h2.section-title {
      font-family: 'Cinzel', serif; font-weight: 700; color: var(--accent); font-size: 1.05em;
      letter-spacing: 2px; text-transform: uppercase; text-align: center; margin-bottom: 15px;
      position: relative; padding-bottom: 8px;
    }
    h2.section-title::after {
      content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 40px; height: 1px; background: var(--accent-dim);
    }

    /* ---------------- Theme tiles ---------------- */
    .theme-groups { display: flex; flex-direction: column; gap: 16px; }
    .theme-group-label {
      font-family: 'Cinzel', serif; font-size: 0.66em; letter-spacing: 3px; text-transform: uppercase;
      color: var(--text-dim); margin-bottom: 8px; display: flex; align-items: center; gap: 8px;
    }
    .theme-group-label::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--border-color), transparent); }
    .theme-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
    .theme-tile {
      position: relative; display: flex; align-items: center; gap: 9px;
      padding: 11px 12px; min-height: 56px; border-radius: 5px;
      border: 1px solid var(--tile-border, var(--border-color));
      background: linear-gradient(135deg, var(--tile-bg-a) 0%, var(--tile-bg-b) 100%);
      cursor: pointer; transition: transform 0.15s, box-shadow 0.2s, border-color 0.2s;
      overflow: hidden; -webkit-tap-highlight-color: transparent;
    }
    .theme-tile input { position: absolute; opacity: 0; width: 0; height: 0; }
    .theme-tile:hover { transform: translateY(-2px); border-color: var(--tile-accent); }
    .theme-tile:active { transform: translateY(0); }
    .theme-tile.checked {
      border-color: var(--tile-accent);
      box-shadow: 0 0 0 1px var(--tile-accent), 0 0 18px -4px var(--tile-accent);
    }
    .tick {
      flex: 0 0 auto; width: 22px; height: 22px; border-radius: 4px;
      border: 1px solid var(--tile-accent); background: rgba(0,0,0,0.4);
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s; position: relative;
    }
    .tick::after {
      content: ''; width: 5px; height: 10px; margin-top: -2px;
      border: solid transparent; border-width: 0 2px 2px 0;
      transform: rotate(45deg) scale(0.4); opacity: 0; transition: all 0.2s;
    }
    .theme-tile.checked .tick { background: var(--tile-accent); box-shadow: 0 0 10px -2px var(--tile-accent); }
    .theme-tile.checked .tick::after { border-color: var(--tile-tick); transform: rotate(45deg) scale(1); opacity: 1; }
    .tile-body { min-width: 0; flex: 1; }
    .tile-name {
      font-family: 'Cinzel', serif; font-weight: 700; font-size: 0.78em; letter-spacing: 1px;
      text-transform: uppercase; color: var(--tile-text); white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis; display: block;
    }
    .tile-sub { font-size: 0.72em; color: var(--tile-sub); letter-spacing: 1px; }
    .tile-crest {
      position: absolute; right: 6px; bottom: -8px; width: 46px; height: 46px;
      color: var(--tile-accent); opacity: 0.2; pointer-events: none;
    }
    .theme-tile.checked .tile-crest { opacity: 0.42; }

    .char-name-wrap { position: relative; margin-bottom: 22px; }
    .char-name-input {
      width: 100%; text-align: center; padding: 10px 8px; background: transparent; border: none;
      border-bottom: 1px solid var(--border-color); color: var(--text-main);
      font-family: 'Cinzel', serif; font-size: 1.5em; font-weight: 700; letter-spacing: 1px;
      outline: none; transition: border-color 0.3s;
    }
    .char-name-input:focus { border-bottom-color: var(--accent); }
    .char-name-input::placeholder { color: var(--text-dim); font-weight: 400; }
    .race-epithet {
      text-align: center; margin-top: 7px; color: var(--text-dim); font-style: italic;
      font-size: 0.92em; letter-spacing: 0.5px;
    }

    @keyframes slowPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.85; } }
    .notification-banner {
      padding: 12px; margin-bottom: 20px; text-align: center; font-family: 'Cinzel', serif;
      font-weight: 700; font-size: 1em; text-transform: uppercase; letter-spacing: 3px;
      animation: slowPulse 3s ease-in-out infinite; border: 1px solid;
    }
    .banner-dead { background: rgba(120,10,10,0.3); color: #d44; border-color: #611; }
    .banner-ko { background: rgba(140,80,10,0.2); color: #d89030; border-color: #604020; }
    .banner-penalty { background: rgba(140,120,10,0.15); color: #c0a030; border-color: #605020; }

    .xp-row { display: flex; justify-content: center; align-items: center; gap: 12px; margin-bottom: 8px; padding-top: 6px; flex-wrap: wrap; }
    .xp-label { font-family: 'Cinzel', serif; font-weight: 700; font-size: 0.82em; letter-spacing: 2px; text-transform: uppercase; color: var(--text-sub); }
    .xp-value { font-family: 'Cinzel', serif; font-weight: 900; font-size: 1.9em; color: var(--accent); min-width: 58px; text-align: center; text-shadow: 0 0 16px var(--accent-dim); }
    .xp-btn {
      width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--border-color);
      background: var(--bg-box-solid); color: var(--text-main); font-size: 1.4em; cursor: pointer;
      display: flex; align-items: center; justify-content: center; transition: all 0.2s;
      font-family: 'Cinzel', serif; line-height: 1; -webkit-tap-highlight-color: transparent;
    }
    .xp-btn:hover { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 14px -4px var(--accent); }
    .xp-btn:active { transform: scale(0.93); }
    .step-group { display: flex; justify-content: center; gap: 6px; margin-bottom: 16px; }
    .step-chip {
      min-width: 46px; min-height: 34px; padding: 4px 10px; border-radius: 4px;
      background: var(--bg-box-solid); border: 1px solid var(--border-color); color: var(--text-dim);
      font-family: 'Cinzel', serif; font-size: 0.74em; font-weight: 700; letter-spacing: 1px;
      cursor: pointer; transition: all 0.2s;
    }
    .step-chip.active { border-color: var(--accent); color: var(--accent); background: var(--bg-box); }

    .section { margin-bottom: 18px; }
    .section-header { display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; padding: 12px 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    .section-header::before, .section-header::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--border-color)); }
    .section-header::after { background: linear-gradient(90deg, var(--border-color), transparent); }
    .section-header:hover h2.section-title { color: var(--text-main); }
    .section-header h2.section-title { margin-bottom: 0; padding-bottom: 0; cursor: pointer; white-space: nowrap; display: flex; align-items: center; gap: 9px; }
    .section-header h2.section-title::after { display: none; }
    .sect-diamond { color: var(--accent-dim); font-size: 0.55em; }
    .toggle-arrow { color: var(--text-dim); font-size: 0.62em; transition: transform 0.3s; display: inline-block; }
    .toggle-arrow.open { transform: rotate(180deg); }
    .section-body { overflow: hidden; transition: max-height 0.45s ease, opacity 0.3s ease; max-height: 0; opacity: 0; }
    .section-body.open { max-height: 12000px; opacity: 1; }

    .controls-row { display: flex; justify-content: center; align-items: center; gap: 14px; margin-bottom: 14px; flex-wrap: wrap; }
    .controls-row label { color: var(--text-sub); font-family: 'Cinzel', serif; font-size: 0.82em; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
    .controls-row select {
      padding: 11px 16px; border-radius: 4px; background: var(--bg-box-solid); color: var(--text-main);
      border: 1px solid var(--border-color); font-family: 'Cinzel', serif; font-size: 16px;
      cursor: pointer; min-height: 46px; letter-spacing: 1px;
    }
    .controls-row select:focus { border-color: var(--accent); outline: none; }
    .race-crest-inline { width: 34px; height: 34px; color: var(--accent); opacity: 0.85; flex: 0 0 auto; }
    .modifier-row { display: flex; flex-wrap: wrap; gap: 9px; justify-content: center; margin-bottom: 18px; }
    .checkbox-label {
      color: var(--text-sub); display: flex; align-items: center; gap: 9px; cursor: pointer;
      font-size: 0.98em; padding: 9px 13px; min-height: 46px; border: 1px solid var(--border-color);
      border-radius: 5px; background: var(--bg-box-solid); transition: all 0.2s; position: relative;
      -webkit-tap-highlight-color: transparent;
    }
    .checkbox-label:hover { border-color: var(--border-hover); }
    .checkbox-label.on { border-color: var(--accent); color: var(--text-main); box-shadow: 0 0 14px -6px var(--accent); }
    .checkbox-label input { position: absolute; opacity: 0; width: 0; height: 0; }
    .mini-tick {
      width: 19px; height: 19px; flex: 0 0 auto; border-radius: 4px;
      border: 1px solid var(--border-hover); background: rgba(0,0,0,0.35);
      display: flex; align-items: center; justify-content: center; transition: all 0.2s;
    }
    .mini-tick::after {
      content: ''; width: 4px; height: 9px; margin-top: -2px;
      border: solid transparent; border-width: 0 2px 2px 0;
      transform: rotate(45deg) scale(0.4); opacity: 0; transition: all 0.2s;
    }
    .checkbox-label.on .mini-tick { background: var(--accent); border-color: var(--accent); }
    .checkbox-label.on .mini-tick::after { border-color: var(--btn-text); transform: rotate(45deg) scale(1); opacity: 1; }

    /* ---------------- Main weapon banner ---------------- */
    .mainweap-banner {
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      background: linear-gradient(135deg, var(--bg-box-solid), var(--bg-box));
      border: 1px solid var(--accent-dim); border-radius: 6px;
      padding: 12px 15px; margin-bottom: 14px; position: relative; overflow: hidden;
      box-shadow: 0 0 22px -12px var(--accent);
    }
    .mw-crest {
      position: absolute; right: -10px; bottom: -18px; width: 92px; height: 92px;
      color: var(--accent); opacity: 0.08; pointer-events: none;
    }
    .mw-star { color: var(--accent); font-size: 1.05em; line-height: 1; flex: 0 0 auto; }
    .mw-body { flex: 1 1 160px; min-width: 0; }
    .mw-label { font-family: 'Cinzel', serif; font-size: 0.58em; letter-spacing: 3px; text-transform: uppercase; color: var(--text-dim); display: block; }
    .mw-name { font-family: 'Cinzel', serif; font-weight: 700; font-size: 1.05em; color: var(--text-main); letter-spacing: 0.5px; display: block; margin-top: 2px; }
    .mw-dmg {
      font-family: 'Cinzel', serif; font-weight: 900; font-size: 0.95em; letter-spacing: 1px;
      color: var(--accent); background: rgba(0,0,0,0.35); border: 1px solid var(--accent-dim);
      padding: 7px 13px; border-radius: 4px; white-space: nowrap; position: relative;
    }
    .mw-traits { font-size: 0.8em; color: var(--text-dim); letter-spacing: 1px; margin-top: 3px; display: block; }
    .mw-switch {
      background: transparent; border: 1px solid var(--border-color); color: var(--text-dim);
      border-radius: 4px; padding: 7px 11px; min-height: 38px; cursor: pointer; position: relative;
      font-family: 'Cinzel', serif; font-size: 0.64em; letter-spacing: 1px; text-transform: uppercase;
      transition: all 0.2s;
    }
    .mw-switch:hover { border-color: var(--accent); color: var(--accent); }
    .mw-empty {
      text-align: center; color: var(--text-dim); font-style: italic; font-size: 0.88em;
      border: 1px dashed var(--border-color); border-radius: 6px; padding: 11px; margin-bottom: 14px;
    }

    /* ---------------- Wounds ---------------- */
    .hit-location { background: var(--bg-box); border-radius: 5px; padding: 15px 17px; margin-bottom: 10px; border: 1px solid var(--border-color); transition: border-color 0.3s ease, background 0.3s; }
    .hit-location:hover { border-color: var(--border-hover); }
    .hit-location.crippled { border-color: var(--danger); background: rgba(120,20,20,0.1); }
    .location-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
    .location-left { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
    .location-name { font-family: 'Cinzel', serif; font-size: 1.05em; font-weight: 700; color: var(--text-main); letter-spacing: 1px; }
    .crippled-warning { color: var(--danger-light); font-size: 0.68em; text-transform: uppercase; font-weight: 700; letter-spacing: 2px; font-family: 'Cinzel', serif; }
    .location-number { background: var(--bg-box-solid); color: var(--text-sub); border: 1px solid var(--border-color); padding: 3px 11px; border-radius: 3px; font-weight: 700; font-family: 'Cinzel', serif; font-size: 0.8em; }

    .ar-block { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
    .ar-shield {
      display: flex; align-items: center; gap: 7px; padding: 5px 11px 5px 8px;
      border: 1px solid var(--border-color); border-radius: 4px; background: var(--bg-box-solid);
      transition: all 0.25s;
    }
    .ar-shield.armored { border-color: var(--accent-dim); box-shadow: 0 0 14px -7px var(--accent); }
    .ar-icon { font-size: 0.95em; color: var(--text-dim); line-height: 1; }
    .ar-shield.armored .ar-icon { color: var(--accent); }
    .ar-cap { font-family: 'Cinzel', serif; font-size: 0.62em; letter-spacing: 2px; text-transform: uppercase; color: var(--text-dim); }
    .ar-total { font-family: 'Cinzel', serif; font-weight: 900; font-size: 1.25em; color: var(--text-main); line-height: 1; min-width: 16px; text-align: center; }
    .ar-shield.armored .ar-total { color: var(--accent); }
    .ar-source { font-size: 0.76em; color: var(--text-dim); font-style: italic; text-align: right; max-width: 240px; }
    .ar-adjust { display: flex; align-items: center; gap: 3px; }
    .ar-btn { width: 28px; height: 28px; border-radius: 4px; border: 1px solid var(--border-color); background: var(--bg-box-solid); color: var(--text-sub); font-size: 0.9em; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; -webkit-tap-highlight-color: transparent; transition: all 0.15s; }
    .ar-btn:hover { border-color: var(--accent); color: var(--accent); }
    .ar-btn:active { transform: scale(0.9); }

    .boxes { display: flex; gap: 7px; flex-wrap: wrap; }
    .box {
      width: 38px; height: 38px; border: 1px solid var(--border-color); background: var(--bg-box-solid);
      border-radius: 4px; cursor: pointer; transition: all 0.15s ease; display: flex;
      align-items: center; justify-content: center; font-weight: 700; font-size: 0.85em;
      color: var(--text-dim); font-family: 'Cinzel', serif; -webkit-tap-highlight-color: transparent;
      user-select: none; box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
    }
    .box:hover { border-color: var(--border-hover); transform: scale(1.08); }
    .box:active { transform: scale(0.94); }
    .box.filled.shock { background: var(--shock-color); border-color: var(--shock-color); color: var(--shock-text); box-shadow: 0 0 12px -4px var(--shock-color); }
    .box.filled.killing { background: var(--killing-color); border-color: var(--killing-color); color: var(--killing-text); box-shadow: 0 0 12px -4px var(--killing-color); }
    .hint { text-align: center; color: var(--text-dim); font-size: 0.86em; font-style: italic; margin-bottom: 14px; }

    /* ---------------- ARMORY ---------------- */
    .gear-tabs { display: flex; gap: 8px; justify-content: center; margin-bottom: 16px; flex-wrap: wrap; }
    .gear-tab {
      flex: 1 1 140px; max-width: 220px; padding: 12px 16px; min-height: 50px; border-radius: 6px;
      background: var(--bg-box-solid); border: 1px solid var(--border-color); color: var(--text-dim);
      font-family: 'Cinzel', serif; font-size: 0.78em; font-weight: 700; letter-spacing: 2px;
      text-transform: uppercase; cursor: pointer; transition: all 0.2s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      -webkit-tap-highlight-color: transparent;
    }
    .gear-tab:hover { border-color: var(--border-hover); color: var(--text-sub); }
    .gear-tab.active { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 18px -7px var(--accent); background: var(--bg-box); }
    .gear-tab-glyph { font-size: 1.15em; line-height: 1; }
    .gear-count { font-size: 0.85em; opacity: 0.7; font-weight: 400; }

    .gear-card {
      background: var(--bg-box-solid); border: 1px solid var(--border-color); border-radius: 5px;
      padding: 12px 14px; margin-bottom: 9px; transition: all 0.2s;
    }
    .gear-card.off { opacity: 0.45; }
    .gear-card.on { border-color: var(--accent-dim); }
    .gear-card.primary { border-color: var(--accent); box-shadow: 0 0 20px -9px var(--accent); }
    .gear-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .equip-toggle {
      position: relative; display: flex; align-items: center; gap: 8px; cursor: pointer;
      flex: 1 1 130px; min-width: 0; -webkit-tap-highlight-color: transparent;
    }
    .equip-toggle input { position: absolute; opacity: 0; width: 0; height: 0; }
    .equip-tick {
      width: 20px; height: 20px; flex: 0 0 auto; border-radius: 4px; border: 1px solid var(--border-hover);
      background: rgba(0,0,0,0.35); display: flex; align-items: center; justify-content: center; transition: all 0.2s;
    }
    .equip-tick::after {
      content: ''; width: 4px; height: 9px; margin-top: -2px; border: solid transparent;
      border-width: 0 2px 2px 0; transform: rotate(45deg) scale(0.4); opacity: 0; transition: all 0.2s;
    }
    .gear-card.on .equip-tick { background: var(--accent); border-color: var(--accent); }
    .gear-card.on .equip-tick::after { border-color: var(--btn-text); transform: rotate(45deg) scale(1); opacity: 1; }
    .gear-name-input {
      font-family: 'Cinzel', serif; font-weight: 700; color: var(--text-main); font-size: 0.95em;
      letter-spacing: 0.5px; background: transparent; border: none; border-bottom: 1px solid transparent;
      padding: 4px 2px; min-width: 0; width: 100%; outline: none; transition: border-color 0.2s;
    }
    .gear-name-input:focus { border-bottom-color: var(--accent); }
    .star-btn {
      background: transparent; border: 1px solid var(--border-color); border-radius: 4px;
      color: var(--text-dim); font-size: 1em; line-height: 1; width: 36px; height: 36px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all 0.2s; flex: 0 0 auto; -webkit-tap-highlight-color: transparent;
    }
    .star-btn:hover { border-color: var(--accent); color: var(--accent); }
    .star-btn.on { color: var(--accent); border-color: var(--accent); text-shadow: 0 0 10px var(--accent-dim); background: var(--bg-box); }
    .gear-stat { display: flex; align-items: center; gap: 5px; }
    .gear-stat-label { font-family: 'Cinzel', serif; font-size: 0.62em; letter-spacing: 2px; color: var(--text-dim); text-transform: uppercase; }
    .gear-stat-val { font-family: 'Cinzel', serif; font-weight: 900; font-size: 1.15em; color: var(--accent); min-width: 26px; text-align: center; }
    .tag-row { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 10px; align-items: center; }
    .tag-chip {
      min-width: 44px; min-height: 36px; padding: 5px 9px; border-radius: 4px;
      background: var(--bg-box); border: 1px solid var(--border-color); color: var(--text-dim);
      font-family: 'Cinzel', serif; font-size: 0.7em; font-weight: 700; letter-spacing: 1px;
      cursor: pointer; transition: all 0.15s; -webkit-tap-highlight-color: transparent;
    }
    .tag-chip:hover { border-color: var(--border-hover); color: var(--text-sub); }
    .tag-chip.on { background: var(--accent); border-color: var(--accent); color: var(--btn-text); }
    .tag-label {
      font-family: 'Cinzel', serif; font-size: 0.6em; letter-spacing: 2px; text-transform: uppercase;
      color: var(--text-dim); align-self: center; margin-right: 2px;
    }
    .gear-notes {
      width: 100%; margin-top: 9px; padding: 8px 10px; background: var(--bg-box);
      border: 1px solid var(--border-color); color: var(--text-sub); border-radius: 4px;
      font-size: 15px; font-family: 'Crimson Text', serif; min-height: 40px;
    }
    .gear-notes:focus { border-color: var(--accent); outline: none; color: var(--text-main); }

    /* ---------------- Damage builder ---------------- */
    .dmg-preview {
      display: flex; align-items: center; gap: 9px; flex-wrap: wrap;
      background: rgba(0,0,0,0.3); border: 1px solid var(--accent-dim); border-radius: 5px;
      padding: 9px 12px; margin-top: 11px;
    }
    .dmg-preview-label { font-family: 'Cinzel', serif; font-size: 0.58em; letter-spacing: 2px; text-transform: uppercase; color: var(--text-dim); }
    .dmg-preview-text { font-family: 'Cinzel', serif; font-weight: 900; font-size: 0.98em; color: var(--accent); letter-spacing: 1px; flex: 1; min-width: 0; }
    .dmg-part {
      border: 1px solid var(--border-color); border-radius: 5px; padding: 9px 10px;
      margin-top: 8px; background: var(--bg-box);
    }
    .dmg-part-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .dmg-seg { display: flex; gap: 4px; }
    .seg-chip {
      min-height: 36px; padding: 6px 10px; border-radius: 4px; background: var(--bg-box-solid);
      border: 1px solid var(--border-color); color: var(--text-dim); font-family: 'Cinzel', serif;
      font-size: 0.68em; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
      cursor: pointer; transition: all 0.15s; -webkit-tap-highlight-color: transparent;
    }
    .seg-chip:hover { border-color: var(--border-hover); color: var(--text-sub); }
    .seg-chip.on { background: var(--accent); border-color: var(--accent); color: var(--btn-text); }
    .seg-chip.kill.on { background: var(--killing-color); border-color: var(--killing-color); color: var(--killing-text); }
    .seg-chip.shock.on { background: var(--shock-color); border-color: var(--shock-color); color: var(--shock-text); }
    .mod-stepper { display: flex; align-items: center; gap: 4px; }
    .mod-val { font-family: 'Cinzel', serif; font-weight: 900; font-size: 1em; color: var(--text-main); min-width: 30px; text-align: center; }
    .dmg-add-btn {
      margin-top: 9px; width: 100%; padding: 10px; min-height: 44px; border-radius: 5px;
      background: transparent; border: 1px dashed var(--border-hover); color: var(--text-sub);
      font-family: 'Cinzel', serif; font-size: 0.68em; font-weight: 700; letter-spacing: 2px;
      text-transform: uppercase; cursor: pointer; transition: all 0.2s;
    }
    .dmg-add-btn:hover { border-style: solid; border-color: var(--accent); color: var(--accent); }
    .dmg-formula-row { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 9px; }
    .formula-chip {
      padding: 7px 10px; min-height: 36px; border-radius: 4px; background: var(--bg-box-solid);
      border: 1px dashed var(--border-color); color: var(--text-dim); font-family: 'Cinzel', serif;
      font-size: 0.64em; font-weight: 700; letter-spacing: 1px; cursor: pointer; transition: all 0.2s;
    }
    .formula-chip:hover { border-style: solid; border-color: var(--accent); color: var(--accent); }

    .preset-row { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-bottom: 10px; }
    .preset-btn {
      padding: 9px 12px; min-height: 42px; border-radius: 5px; background: var(--bg-box-solid);
      border: 1px dashed var(--border-hover); color: var(--text-sub); font-family: 'Cinzel', serif;
      font-size: 0.7em; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
      cursor: pointer; transition: all 0.2s;
    }
    .preset-btn:hover { border-style: solid; border-color: var(--accent); color: var(--accent); }
    .sub-head {
      font-family: 'Cinzel', serif; font-size: 0.64em; letter-spacing: 3px; text-transform: uppercase;
      color: var(--text-dim); margin: 4px 0 10px; display: flex; align-items: center; gap: 8px;
    }
    .sub-head::before, .sub-head::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--border-color)); }
    .sub-head::after { background: linear-gradient(90deg, var(--border-color), transparent); }
    .armor-mode-row { display: flex; justify-content: center; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
    .mode-chip {
      padding: 9px 15px; min-height: 42px; border-radius: 5px; background: var(--bg-box-solid);
      border: 1px solid var(--border-color); color: var(--text-dim); font-family: 'Cinzel', serif;
      font-size: 0.72em; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
      cursor: pointer; transition: all 0.2s;
    }
    .mode-chip.active { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 14px -6px var(--accent); }
    .armor-summary { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin: 14px 0 4px; }
    .sum-cell { text-align: center; padding: 8px 4px; border-radius: 4px; background: var(--bg-box); border: 1px solid var(--border-color); }
    .sum-cell.covered { border-color: var(--accent-dim); }
    .sum-loc { font-family: 'Cinzel', serif; font-size: 0.6em; letter-spacing: 1px; color: var(--text-dim); text-transform: uppercase; display: block; }
    .sum-ar { font-family: 'Cinzel', serif; font-weight: 900; font-size: 1.15em; color: var(--text-sub); }
    .sum-cell.covered .sum-ar { color: var(--accent); }
    .note-line { text-align: center; color: var(--text-dim); font-size: 0.82em; font-style: italic; margin-top: 12px; line-height: 1.5; }

    /* ---------------- Dice ---------------- */
    .module-card { background: var(--bg-box); border-radius: 5px; padding: 18px 16px; border: 1px solid var(--border-color); position: relative; }
    .dice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 18px; }
    .stepper { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 12px; }
    .step-btn {
      width: 54px; height: 54px; flex: 0 0 auto; border-radius: 9px; border: 1px solid var(--border-color);
      background: var(--bg-box-solid); color: var(--text-main); font-size: 1.6em; line-height: 1;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all 0.15s; font-family: 'Cinzel', serif; -webkit-tap-highlight-color: transparent;
    }
    .step-btn:hover { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 16px -6px var(--accent); }
    .step-btn:active { transform: scale(0.92); }
    .step-btn:disabled { opacity: 0.28; cursor: default; box-shadow: none; }
    .pool-display { display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 88px; }
    .pool-num { font-family: 'Cinzel', serif; font-weight: 900; font-size: 2.5em; line-height: 1; color: var(--accent); text-shadow: 0 0 22px var(--accent-dim); }
    .pool-cap { font-family: 'Cinzel', serif; font-size: 0.6em; letter-spacing: 2px; text-transform: uppercase; color: var(--text-dim); margin-top: 4px; }
    .quick-row { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 14px; }
    .quick-chip {
      width: 40px; height: 40px; border-radius: 6px; border: 1px solid var(--border-color);
      background: var(--bg-box-solid); color: var(--text-sub); font-family: 'Cinzel', serif;
      font-weight: 700; font-size: 0.9em; cursor: pointer; transition: all 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .quick-chip:hover { border-color: var(--border-hover); color: var(--text-main); }
    .quick-chip.active { background: var(--accent); border-color: var(--accent); color: var(--btn-text); box-shadow: 0 0 14px -4px var(--accent); }
    .roll-btn {
      position: relative; overflow: hidden; width: 100%; background: var(--accent); color: var(--btn-text);
      padding: 15px 20px; border: none; border-radius: 6px; font-size: 0.98em; font-weight: 700;
      cursor: pointer; transition: all 0.15s; text-transform: uppercase; font-family: 'Cinzel', serif;
      letter-spacing: 2px; min-height: 54px; -webkit-tap-highlight-color: transparent;
      box-shadow: 0 3px 0 -1px rgba(0,0,0,0.45), 0 0 24px -8px var(--accent);
    }
    .roll-btn::after {
      content: ''; position: absolute; top: 0; left: -60%; width: 40%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.28), transparent);
      transform: skewX(-20deg); transition: left 0.5s ease;
    }
    .roll-btn:hover::after { left: 120%; }
    .roll-btn:hover { filter: brightness(1.12); }
    .roll-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 -1px rgba(0,0,0,0.45); filter: brightness(0.94); }
    .roll-btn:disabled { opacity: 0.75; cursor: wait; }

    .dice-tray {
      display: flex; gap: 9px; flex-wrap: wrap; justify-content: center;
      margin: 16px 0 12px; min-height: 54px; align-items: center;
      padding: 12px 8px; border-radius: 6px;
      background: radial-gradient(ellipse at 50% 40%, rgba(0,0,0,0.28), transparent 70%);
    }
    .die-wrap { position: relative; display: flex; align-items: center; justify-content: center; }
    .die {
      position: relative; width: 46px; height: 50px; clip-path: var(--d10);
      background: var(--border-hover); transform-origin: 50% 55%;
      filter: drop-shadow(0 3px 4px rgba(0,0,0,0.55));
    }
    .die-inner {
      position: absolute; inset: 2px; clip-path: var(--d10);
      background: var(--bg-box-solid);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Cinzel', serif; font-weight: 900; font-size: 1.15em;
      color: var(--text-main); padding-top: 5px;
      background-image:
        linear-gradient(150deg, transparent 49.2%, rgba(255,255,255,0.09) 49.6%, transparent 50.4%),
        linear-gradient(-150deg, transparent 49.2%, rgba(255,255,255,0.09) 49.6%, transparent 50.4%),
        linear-gradient(to bottom, rgba(255,255,255,0.07), transparent 55%);
    }
    .die.matched { background: var(--accent); filter: drop-shadow(0 0 9px var(--accent-dim)) drop-shadow(0 3px 4px rgba(0,0,0,0.5)); }
    .die.matched .die-inner { color: var(--btn-text); background-color: var(--accent); }
    @keyframes tumble {
      0%   { transform: translateY(0) rotate(0deg)    scale(1); }
      25%  { transform: translateY(-13px) rotate(-95deg)  scale(1.06); }
      50%  { transform: translateY(2px) rotate(-185deg) scale(0.95); }
      75%  { transform: translateY(-9px) rotate(-275deg) scale(1.04); }
      100% { transform: translateY(0) rotate(-360deg) scale(1); }
    }
    @keyframes settleIn {
      0%   { transform: scale(1.3) rotate(-18deg); }
      55%  { transform: scale(0.93) rotate(4deg); }
      100% { transform: scale(1) rotate(0deg); }
    }
    .die.rolling { animation: tumble 0.42s linear infinite; }
    .die.landed { animation: settleIn 0.3s cubic-bezier(0.2,1.5,0.5,1); }
    @keyframes matchGlow { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }
    .die-wrap.is-match::after {
      content: ''; position: absolute; inset: -5px; clip-path: var(--d10);
      background: var(--accent); z-index: -1; filter: blur(6px);
      animation: matchGlow 2s ease-in-out infinite;
    }
    .roll-status {
      text-align: center; font-family: 'Cinzel', serif; font-size: 0.7em; letter-spacing: 3px;
      text-transform: uppercase; color: var(--text-dim); margin-bottom: 8px; min-height: 14px;
    }
    .matches-section { background: var(--bg-box-solid); border: 1px solid var(--border-color); border-radius: 4px; padding: 12px; text-align: center; }
    .match-result { display: inline-block; background: var(--accent); color: var(--btn-text); padding: 7px 14px; border-radius: 4px; margin: 3px; font-weight: 700; font-family: 'Cinzel', serif; font-size: 1em; box-shadow: 0 0 16px -6px var(--accent); }
    .dmg-result {
      display: block; margin-top: 8px; font-family: 'Cinzel', serif; font-size: 0.82em;
      color: var(--text-sub); letter-spacing: 1px;
    }
    .dmg-result b { color: var(--accent); font-weight: 900; }
    .healing-result { display: inline-block; background: var(--bg-box); border: 1px solid var(--accent-dim); color: var(--text-main); padding: 7px 12px; border-radius: 4px; margin: 3px; font-size: 0.9em; }
    .no-match { color: var(--text-dim); font-style: italic; }

    /* ---------------- Inventory / traits ---------------- */
    .item-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
    .item-card { background: var(--bg-box-solid); border: 1px solid var(--border-color); border-radius: 4px; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; transition: border-color 0.2s; }
    .item-card:hover { border-color: var(--border-hover); }
    .item-info { flex: 1; min-width: 0; }
    .item-name { font-family: 'Cinzel', serif; font-weight: 700; color: var(--accent); font-size: 1em; letter-spacing: 0.5px; }
    .item-detail { color: var(--text-sub); font-size: 0.9em; margin-top: 2px; } .item-detail span { margin-right: 14px; }
    .item-right { display: flex; align-items: center; gap: 8px; }
    .qty-controls { display: flex; align-items: center; gap: 4px; }
    .qty-btn { width: 34px; height: 34px; border-radius: 4px; border: 1px solid var(--border-color); background: var(--bg-box); color: var(--text-sub); font-size: 1em; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s; font-family: 'Cinzel', serif; line-height: 1; padding: 0; }
    .qty-btn:hover { border-color: var(--accent); color: var(--accent); }
    .qty-display { min-width: 26px; text-align: center; font-weight: 700; color: var(--text-main); font-family: 'Cinzel', serif; font-size: 1em; }
    .add-form { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; padding-top: 12px; border-top: 1px solid var(--border-color); }
    .form-field { display: flex; flex-direction: column; gap: 4px; }
    .form-field label { color: var(--text-dim); font-size: 0.68em; text-transform: uppercase; letter-spacing: 1.5px; font-family: 'Cinzel', serif; }
    .form-field input { padding: 10px; background: var(--bg-box-solid); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 4px; font-size: 16px; font-family: 'Crimson Text', serif; min-height: 44px; width: 100%; }
    .form-field input:focus { border-color: var(--accent); outline: none; }
    .remove-btn { background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 1.2em; padding: 8px 10px; transition: color 0.2s; min-width: 40px; min-height: 40px; }
    .remove-btn:hover { color: var(--danger-light); }
    .add-btn-sm { padding: 11px 16px; border: 1px solid var(--border-color); border-radius: 4px; background: var(--bg-box-solid); color: var(--text-sub); font-weight: 700; cursor: pointer; font-family: 'Cinzel', serif; font-size: 0.78em; letter-spacing: 1px; text-transform: uppercase; transition: all 0.2s; min-height: 44px; }
    .add-btn-sm:hover { border-color: var(--accent); color: var(--accent); }
    .traits-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    .trait-column h3 { font-family: 'Cinzel', serif; font-weight: 700; color: var(--text-sub); font-size: 0.76em; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 9px; text-align: center; }
    .trait-column.problems h3 { color: var(--danger); }
    .trait-list { display: flex; flex-direction: column; gap: 5px; margin-bottom: 8px; }
    .trait-item { display: flex; justify-content: space-between; align-items: center; background: var(--bg-box-solid); border: 1px solid var(--border-color); border-radius: 4px; padding: 6px 10px; }
    .trait-item-text { color: var(--text-main); font-size: 0.95em; flex: 1; }
    .trait-add-row { display: flex; gap: 6px; }
    .trait-add-row input { flex: 1; min-width: 0; padding: 10px; background: var(--bg-box-solid); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 4px; font-size: 16px; font-family: 'Crimson Text', serif; min-height: 44px; }
    .trait-add-row input:focus { border-color: var(--accent); outline: none; }
    .trait-add-btn { background: var(--bg-box-solid); color: var(--text-sub); border: 1px solid var(--border-color); border-radius: 4px; padding: 6px 16px; font-weight: 700; cursor: pointer; font-size: 1.1em; transition: all 0.2s; font-family: 'Cinzel', serif; min-height: 44px; min-width: 48px; }
    .trait-add-btn:hover { border-color: var(--accent); color: var(--accent); }
    .legend { display: flex; justify-content: center; gap: 25px; margin-top: 18px; padding: 10px; font-size: 0.9em; }
    .legend-item { display: flex; align-items: center; gap: 8px; color: var(--text-sub); }
    .legend-box { width: 20px; height: 20px; border-radius: 4px; }
    .legend-box.shock { background: var(--shock-color); } .legend-box.killing { background: var(--killing-color); }
    .controls { display: flex; gap: 10px; margin-top: 24px; justify-content: center; flex-wrap: wrap; }
    .controls button { padding: 13px 24px; border: 1px solid; border-radius: 4px; font-size: 0.78em; font-weight: 700; cursor: pointer; transition: all 0.2s; text-transform: uppercase; font-family: 'Cinzel', serif; letter-spacing: 1px; min-height: 46px; }
    .controls button:hover { filter: brightness(1.15); }
    .reset-btn { background: transparent; color: var(--danger-light); border-color: var(--danger); }
    .reset-btn:hover { background: rgba(160,48,48,0.12); }
    .reset-all-btn { background: transparent; color: var(--text-dim); border-color: var(--border-color); }
    .reset-all-btn:hover { background: rgba(255,255,255,0.03); color: var(--text-sub); }
    .divider { width: 100%; height: 1px; margin: 20px 0; background: linear-gradient(90deg, transparent, var(--border-color), transparent); }
    .empty-state { text-align: center; color: var(--text-dim); font-style: italic; padding: 12px 0; font-size: 0.95em; }
    .footer-note { text-align: center; color: var(--text-dim); font-size: 0.74em; letter-spacing: 2px; font-family: 'Cinzel', serif; text-transform: uppercase; margin-top: 22px; opacity: 0.7; }
    .credit-note { text-align: center; color: var(--text-dim); font-size: 0.66em; margin-top: 10px; opacity: 0.5; font-style: italic; line-height: 1.6; }

    @media (max-width: 700px) {
      .app-wrapper { padding: 10px 8px calc(16px + env(safe-area-inset-bottom)); }
      .container { padding: 26px 13px 24px; border-radius: 6px; }
      .container::before { inset: 5px; }
      h1 { font-size: 1.5em; letter-spacing: 2px; }
      .crest-main { width: 58px; height: 58px; }
      .crest-watermark { width: 165px; height: 165px; top: -16px; }
      .subtitle { font-size: 0.66em; letter-spacing: 3px; }
      .flourish::before, .flourish::after { width: 55px; }
      .char-name-input { font-size: 1.25em; }
      .theme-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
      .dice-grid { grid-template-columns: 1fr; }
      .traits-grid { grid-template-columns: 1fr; }
      .hit-location { padding: 14px 12px; }
      .box { width: 44px; height: 44px; font-size: 0.95em; }
      .die { width: 50px; height: 54px; }
      .quick-chip { width: 44px; height: 44px; font-size: 1em; }
      .pool-num { font-size: 2.9em; }
      .step-btn { width: 62px; height: 62px; font-size: 1.9em; }
      .form-field { flex: 1 1 100% !important; }
      .add-btn-sm { flex: 1 1 100%; }
      .controls button { flex: 1 1 100%; }
      .location-header { flex-direction: column; align-items: flex-start; }
      .ar-block { align-items: flex-start; }
      .ar-source { text-align: left; max-width: 100%; }
      .armor-summary { grid-template-columns: repeat(3, 1fr); }
      .equip-toggle { flex: 1 1 100%; }
      .gear-tab { flex: 1 1 100%; max-width: none; }
      .mw-dmg { flex: 1 1 100%; text-align: center; }
    }
    @media (max-width: 380px) {
      .theme-grid { grid-template-columns: 1fr; }
    }
    @media (prefers-reduced-motion: reduce) {
      .die.rolling, .die.landed, .die-wrap.is-match::after { animation: none !important; }
